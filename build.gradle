plugins {
    id 'java'
}

group = 'com.marduc812'
version = '2.1'

repositories {
    mavenCentral()
}

/**
 * Burp runs extensions on the JRE it bundles, and a class file newer than that JRE is
 * rejected outright with UnsupportedClassVersionError — the extension never initialises,
 * so there is no tab and not even a line in the output log. Without this the target is
 * whatever JDK happened to run Gradle, which makes the jar's minimum Java version an
 * accident of the build machine; that matters doubly here because the BApp Store builds
 * from source on PortSwigger's own infrastructure. 17 is the Montoya API's own baseline.
 */
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    implementation 'net.portswigger.burp.extensions:montoya-api:2023.8'
}

jar {
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

test {
    useJUnitPlatform()
}